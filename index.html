<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport"

<title>Sachin Rajput | 365 Day Brahmachari Challenge</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

}

.page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
}

.poster {
    width: 100%;
    height: auto;
    display: block;
}

/* Invisible clickable buttons */
.link {
    position: absolute;
    left: 3%;

    display: block;
    z-index: 20;
}

/* Social buttons */
.instagram1 {
    top: 43.0%;
}

.instagram2 {
    top: 47.2%;
}

.instagram3 {
    top: 51.4%;
}

.youtube {
    top: 55.6%;
}

.facebook1 {
    top: 59.8%;
}

.facebook2 {
    top: 64.0%;
}
</style>
</head>

<body>

<div class="page">

    <!-- IMPORTANT:
         GitHub file ka naam EXACTLY
         Sachin_Rajput_Poster.jpg
         hona chahiye.
    -->

    <img
        src="./Sachin_Rajput_Poster.jpg"
        class="poster"
        alt="Sachin Rajput 0 to 365 Day Brahmachari Challenge"
    >

    <!-- Instagram 1 -->
    <a
        class="link instagram1"
        href="https://www.instagram.com/sachinrajput01/"
        target="_blank"

    <!-- Instagram 2 -->

    <a
        class="link youtube"
        href="https://www.youtube.com/@sachinrajput365days"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube Sachin Rajput 365 Days">
    </a>

    <!-- Facebook Profile -->
    <a
        class="link facebook1"
        href="https://www.facebook.com/search/top?q=Sachin%20Rajput"
        target="_blank"
        rel="noopener noreferrer"

    <!-- Facebook Page -->
