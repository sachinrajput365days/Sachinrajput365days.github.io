<title>Sachin Rajput | Social Hub</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#06120a,#0b0f0c);
  color:white;
  min-height:100vh;
}

.container{
  max-width:520px;
  margin:auto;
  padding:35px 20px;
  text-align:center;
}

.logo{
  width:105px;
  height:105px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#20c463,#0b6b35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:bold;
  border:4px solid #39e879;
  box-shadow:0 0 30px rgba(57,232,121,.35);
}

h1{
  margin:22px 0 8px;
  font-size:34px;
  letter-spacing:1px;
}

.subtitle{
  color:#a9b5ad;
  font-size:17px;
  margin-bottom:30px;
}

.card{
  background:rgba(20,30,24,.9);
  border:1px solid #244b32;
  border-radius:22px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.card h2{
  margin-top:0;
  color:#42e77b;
}

.btn{
  display:block;
  text-decoration:none;
  color:white;
  background:#123c22;
  border:1px solid #2f9d57;
  padding:16px;
  margin:13px 0;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
}

.instagram{
  border-color:#d62976;
}

.youtube{
  border-color:#ff3333;
}

.facebook{
  border-color:#3b82f6;
}

.footer{
  margin-top:30px;
  color:#8e9b92;
  font-size:14px;
}

.radhe{
  color:#42e77b;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
