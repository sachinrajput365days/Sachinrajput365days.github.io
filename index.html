<!DOCTYPE html>
<html lang="hi">
<head>

  <title>Sachin Rajput | 365 Day Brahmachari Challenge</title>

  <style>

    html,

      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

      width: 100%;

      width: 100%;
      height: auto;
    }

    .social-link {

      left: 4%;
      width: 92%;
      z-index: 20;
      display: block;
    }

    /* Instagram 1 */
    .instagram1 {
      top: 50.0%;
      height: 3.5%;
    }

    /* Instagram 2 */
    .instagram2 {
      top: 53.8%;
      height: 3.5%;
    }

    /* Instagram 3 */
    .instagram3 {
      top: 57.6%;
      height: 3.5%;
    }

    /* YouTube */
    .youtube {
      top: 61.4%;
      height: 3.5%;
    }

    /* Facebook Profile */
    .facebook-profile {
      top: 65.2%;
      height: 3.5%;
    }

    /* Facebook Page */
    .facebook-page {
      top: 69.0%;
      height: 3.5%;
    }
  </style>
</head>

<body>

  <div class="poster-wrap">

    <img
      class="poster"

    </a>

    <!-- Instagram 2 -->

      href="https://www.instagram.com/sachinrajput365days/"

    </a>

    <!-- Instagram 3 -->

      class="social-link instagram3"
      href="https://www.instagram.com/sachinrajput188/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram Sachin Rajput 188">
    </a>

    <!-- YouTube -->
    <a
      class="social-link youtube"
      href="https://www.youtube.com/@sachinrajput365days"
      target="_blank"
