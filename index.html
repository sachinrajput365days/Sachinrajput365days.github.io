<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sachin Rajput | 365 Day Brahmachari Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      max-width: 900px;
      line-height: 0;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      Transparent clickable areas
      Poster ko bilkul change nahi kiya gaya hai.
    */

    .link {
      position: absolute;
      display: block;
      z-index: 10;
      background: transparent;
      cursor: pointer;
    }

    /* Instagram 1 */
    .instagram01 {
      left: 5%;
      top: 48.5%;
      width: 90%;
      height: 4.2%;
    }

    /* Instagram 365 Days */
    .instagram365 {
      left: 5%;
      top: 52.8%;
      width: 90%;
      height: 4.2%;
    }

    /* Instagram 188 */
    .instagram188 {
      left: 5%;
      top: 57.0%;
      width: 90%;
      height: 4.2%;
    }

    /* YouTube */
    .youtube {
      left: 5%;
      top: 61.2%;
      width: 90%;
      height: 4.2%;
    }

    /* Facebook Main Profile */
    .facebook-profile {
      left: 5%;
      top: 65.4%;
      width: 90%;
      height: 4.2%;
    }

    /* Facebook Page */
    .facebook-page {
      left: 5%;
      top: 69.6%;
      width: 90%;
      height: 4.2%;
    }

    /* QR Code */
    .qr {
      left: 25%;
      top: 87%;
      width: 50%;
      height: 12%;
    }
  </style>
</head>

<body>

  <div class="poster-wrap">

    <img
      class="poster"
      src="Sachin_Rajput_FINAL_POSTER_WITH_BIG_WORKING_QR.jpg"
      alt="Sachin Rajput 0 to 365 Day Brahmachari Challenge"
    >

    <!-- Instagram -->
    <a
      class="link instagram01"
      href="https://www.instagram.com/sachinrajput01/"
      target="_blank"
      aria-label="Instagram Sachin Rajput 01">
    </a>

    <a
      class="link instagram365"
      href="https://www.instagram.com/sachinrajput365days/"
      target="_blank"
      aria-label="Instagram Sachin Rajput 365 Days">
    </a>

    <a
      class="link instagram188"
      href="https://www.instagram.com/sachinrajput188/"
      target="_blank"
      aria-label="Instagram Sachin Rajput 188">
    </a>

    <!-- YouTube -->
    <a
      class="link youtube"
      href="https://www.youtube.com/@sachinrajput365days"
      target="_blank"
      aria-label="YouTube Sachin Rajput 365 Days">
    </a>

    <!-- Facebook -->
    <a
      class="link facebook-profile"
      href="https://www.facebook.com/search/top?q=Sachin%20Rajput"
      target="_blank"
      aria-label="Facebook Sachin Rajput">
    </a>

    <a
      class="link facebook-page"
      href="https://www.facebook.com/search/pages?q=Sachin%20Rajput"
      target="_blank"
      aria-label="Facebook Page Sachin Rajput">
    </a>

    <!-- QR -->
    <a
      class="link qr"
      href="https://sachinrajput365days.github.io/"
      target="_blank"
      aria-label="Sachin Rajput Social Links">
    </a>

  </div>

</body>
</html>
